
name: CI BASIC

#primeiro, configuramos o comando que ira dispararar a nossa pipe
on:
  #apenas push nesse primeiro caso
  push:
    branches:
      - main
    #quais arquivos modificados não iram disparar
    paths-ignore:
        - '**.md'
        - '**.MD'

jobs:
  # nome do job
  first-job:
    #runner
    runs-on:
      - ubuntu-latest

    steps:
      #Checkout principal, sem esse trecho o runner do ubuntu nao tem acesso ao codigo
      - name: Checkout
      #Isso se trata de uma action, basicmante um componente reutilizavel para abstrair comandos
        uses: actions/checkout@v4 #Essa action permite o runner pegar o repositorio e deixa os arquivos disponiveis para os pŕoximos passos

      #Run serve para rodar um comando dentro do runner nesse job
      - name: List content
        run: ls

  second-job:
    needs: first-job

    runs-on:
      - ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Message after List content
        run: echo "Hello World"



