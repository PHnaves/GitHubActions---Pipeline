name: CI BASIC

# Primeiro, configuramos o evento que irá disparar nossa pipeline
on:
  # A pipeline será disparada apenas por push
  pull_request: #temporario apenas para nao rodar sozinha para teste do workflow_dispatch
    # Define em qual branch o push deve acontecer
    branches:
      - main

    # Define quais arquivos, quando alterados isoladamente,
    # não irão disparar a pipeline
    paths-ignore:
      - '**.md'
      - '**.MD'

  workflow_dispatch: # Permite disparar a pipeline manualmente na aba Actions
    inputs:
      # Define um input chamado "environment" com valor padrão "production" que podemos utilizar em nossos jobs
      environment:
        description: 'Environment to deploy'
        required: true
        # Define que o input será do tipo escolha (choice) UI
        type: choice
        # opções permitidas para o input "environment" no dropdown da UI
        options:
          - production
          - staging
        default: 'production'

env:
  # Define variáveis de ambiente globais para todos os jobs
  # e steps da pipeline, salvo se forem sobrescritas
  GLOBAL_VAR: 'This is a global variable'


concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
  # Nome identificador do primeiro job
  first-job:
    # Define o runner que irá executar os comandos deste job
    # Cada job possui seu próprio runner
    runs-on: ubuntu-latest

    steps:
      # Checkout é uma Action reutilizável que baixa o código
      # do repositório e disponibiliza os arquivos no runner
      - name: Checkout
        uses: actions/checkout@v4

      # Run executa um comando diretamente no runner
      - name: List content
        if: inputs.environment != '' # Condição para executar este step apenas se o input "environment" não for nulo
        run: ls && echo ${{ inputs.environment }} # Exibe o conteúdo do diretório e o valor do input "environment"

      - name: List global variables
        run: echo ${{ env.GLOBAL_VAR }}

  # Nome identificador do segundo job
  second-job:
    # Define que este job depende da conclusão bem-sucedida
    # do first-job antes de começar
    needs: first-job

    # Define o sistema operacional do runner deste job
    runs-on: ubuntu-latest

    # Define variáveis de ambiente disponíveis em todos os steps
    # deste job, salvo se forem sobrescritas
    env:
      APP_NAME: GitHubActionsPractice

    steps:
      # Como cada job possui seu próprio runner,
      # precisamos fazer o checkout novamente neste job
      - name: Checkout
        uses: actions/checkout@v4

        # With passa parâmetros de configuração para a Action
        with:
          # Define quantos commits recentes serão obtidos
          # 2 permite consultar o commit atual e o anterior
          fetch-depth: 2

      # Executa um comando no terminal do runner
      - name: Message after List content
        run: echo "Hello World"

      # Consulta informações do commit atual do checkout
      - name: Get current commit
        run: |
          # %H retorna o hash completo do commit
          echo "Hash do commit atual:"
          git log -1 --format='%H'

          # %s retorna o título (subject) do commit
          echo "Titulo do commit atual:"
          git log -1 --format='%s'

      # Consulta informações do commit imediatamente anterior
      - name: Get previous commit
        run: |
          # HEAD~1 representa o primeiro commit anterior ao atual
          echo "Hash do commit anterior:"
          git log -1 --format='%H' HEAD~1

          # Retorna o título do commit anterior
          echo "Titulo do commit anterior:"
          git log -1 --format='%s' HEAD~1

      # If define uma condição para executar ou pular um step
      - name: Show application name
        # github.ref contém a referência associada ao evento
        # Esta condição verifica se a execução está na branch main
        if: github.ref == 'refs/heads/main'
        run: echo "$APP_NAME"

      # success() verifica se os steps e as dependências
      # anteriores foram concluídos com sucesso
      - name: Verify success
        if: success()
        run: echo "Build finished successfully"

  test-job:
    name: Build and Test
    #needs: [second-job, first-job] # Este job só será executado se os jobs first-job e second-job forem concluídos com sucesso
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false # tira o fail-fast para que seja testado as duas versoes do java mesmo que uma falhe
      matrix:
        java_version: ['17', '21'] # Define uma matriz de versões do Java para testar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java_version }}
          cache: 'maven'

      - name: Run tests
        run: mvn -B verify

      - name: Publish test reports
        if: always() # Este step será executado mesmo que o build falhe
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-java-${{ matrix.java_version }}
          path: target/surefire-reports/

      - name : Publish the .jar
        if: matrix.java_version == '17' # Este step será executado apenas para a versão 17 do Java
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar